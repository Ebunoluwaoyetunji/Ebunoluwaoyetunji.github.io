<!doctype html>
<!-- An old address. The Fileo case study moved to /fileo/; this page sends visitors there.
     It counts the old address in GoatCounter first (src/lib/goatcounter.js), then goes on at once.
     If counting is blocked or slow, it goes on after 0.8 s; without JavaScript, after 2 s. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fileo, a case study by Ebunoluwa Oyetunji</title>

    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <script>
      (function () {
        var gone = false;
        window.goOn = function () { if (!gone) { gone = true; location.replace('/fileo/'); } };
        window.countThenGo = function () {
          try { window.goatcounter.count({ path: '/fileo_case_study.html', title: 'Old address: Fileo' }); } catch (e) { /* counting is optional */ }
          window.goOn();
        };
        setTimeout(window.goOn, 800);
      })();
    </script>
    <script data-goatcounter="https://ebunportfolio.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js" onload="countThenGo()" onerror="goOn()"></script>

      body { margin: 0; padding: 48px 24px; background: #f8f6f1; color: #141414; font: 1.125rem/1.6 'IBM Plex Sans', system-ui, sans-serif; }

    </style>
  </head>
